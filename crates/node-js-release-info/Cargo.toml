[package]
name = "node-js-release-info"
description = "Asynchronously retrieve Node.js release info by version and platform from the [downloads server](https://nodejs.org/download/release/)"
version = "1.1.1"
keywords = [
	"nodejs",
	"download",
	"installer",
	"async",
	"http"
]
categories = [
	"development-tools::build-utils",
	"development-tools::testing",
	"web-programming::http-client"
]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest.workspace = true
semver.workspace = true
serde = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "net", "time"] }

[dev-dependencies]
mockito.workspace = true
serde_json.workspace = true
# doc examples use `#[tokio::main]`, which requires the multi-threaded runtime
tokio = { workspace = true, features = ["rt-multi-thread"] }

[features]
json = ["dep:serde"]

[lints]
workspace = true
